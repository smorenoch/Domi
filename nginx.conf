server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 512;

  # index.html nunca se cachea: es el archivo que apunta a los assets
  # nuevos después de cada despliegue. Si se cachea, la tablet sigue
  # cargando la versión vieja aunque el deploy haya funcionado.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Los assets llevan hash en el nombre (index-4HTlqg7p.css), así que
  # un archivo dado nunca cambia de contenido: cache indefinido.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # La navegación de la app va por hash (#/indice, #/leccion/colors), así
  # que el servidor sólo ve "/". El fallback está igual por si alguien
  # entra a una ruta que no existe.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
